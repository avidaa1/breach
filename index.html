<style id="mp-20261124">/* mobile pass + AVIDAA design system v1 (20261124) */html{-webkit-text-size-adjust:100%}img,video{max-width:100%;height:auto}iframe{max-width:100%}pre{max-width:100%;overflow-x:auto}/* AVIDAA design system v1 (20261124). Inline this file into a page; pages stay single files.

  var seg=6+Math.floor(rng()*8);if(x+seg>cfg.len)seg=cfg.len-x;
  var s0=x;for(var i=0;i<seg;i++,x++)col(x,h);

   if(rng()<cfg.drone)L.spawns.push({t:'drone',x:(s0+Math.floor(seg/2))*TS,y:Math.max(3,h-6)*TS});
  }
  if(rng()<0.6){var gn=2+Math.floor(rng()*3);for(k=0;k<gn&&k<seg-1;k++)L.pickups.push({k:'coin',x:(s0+1+k)*TS+4,y:(h-2)*TS+4});}
  if(seg>=7&&rng()<0.55){var pl=3+Math.floor(rng()*3),py=h-3,px=s0+1+Math.floor(rng()*Math.max(1,seg-pl-1));
   for(k=0;k<pl;k++)tiles[py][px+k]=2;
   var rr2=rng();
   if(rr2<0.2)L.pickups.push({k:rng()<0.5?'rapid':'spread',x:(px+1)*TS+4,y:(py-1)*TS+4});
   else if(rr2<0.32)L.pickups.push({k:'heart',x:(px+1)*TS+4,y:(py-1)*TS+4});
   else if(rr2<0.40)L.pickups.push({k:'ammo',x:(px+1)*TS+4,y:(py-1)*TS+4});

   else for(k=0;k<pl;k++)L.pickups.push({k:'coin',x:(px+k)*TS+4,y:(py-1)*TS+4});}
  if(x>=cfg.len)break;

  else if(t<0.7){var dh=(rng()<0.5?-1:1)*(1+Math.floor(rng()*2));h=clamp(h+dh,9,14);}
 }
 while(h!==13){h+=h<13?1:-1;for(k=0;k<3;k++,x++)col(x,h);}
