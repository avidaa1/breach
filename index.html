 g.fillStyle=col;g.fillRect(x,VH-bh,bw,bh);if(ant&&r()<0.3){g.fillRect(x+(bw>>1),VH-bh-10,1,10);}
 g.fillStyle=win;for(var wy=VH-bh+6;wy<VH-6;wy+=9)for(var wx=x+3;wx<x+bw-3;wx+=6)if(r()<dens)g.fillRect(wx,wy,2,3);
 x+=bw+(r()*4|0);}});}
function buildArt(th,seed){var r=rng32(seed),art={};
 art.sky=mkC(VW,VH,function(g){var gr=g.createLinearGradient(0,0,0,VH);gr.addColorStop(0,th.sky[0]);gr.addColorStop(0.6,th.sky[1]);gr.addColorStop(1,th.sky[2]);g.fillStyle=gr;g.fillRect(0,0,VW,VH);
  if(th.stars){for(var i=0;i<90;i++){g.fillStyle='rgba(255,255,255,'+(0.2+r()*0.6).toFixed(2)+')';g.fillRect(r()*VW|0,r()*VH*0.6|0,1,1);}}
  g.fillStyle=th.acc;g.globalAlpha=0.12;g.beginPath();g.arc(372,66,36,0,6.283);g.fill();g.globalAlpha=0.5;g.beginPath();g.arc(372,66,20,0,6.283);g.fill();g.globalAlpha=1;});
 art.far=skyline(r,th.far,th.win,60,150,0.2,false);
 art.near=skyline(r,th.near,th.win,40,110,0.12,true);
 art.top=mkC(16,16,function(g){g.fillStyle=th.g;g.fillRect(0,0,16,16);g.fillStyle=th.gLine;g.fillRect(0,4,16,1);g.fillRect(3,9,1,4);g.fillRect(3,12,6,1);g.fillRect(11,7,1,6);g.fillStyle=th.gTop;g.fillRect(0,0,16,2);g.globalAlpha=0.35;g.fillRect(0,2,16,1);g.globalAlpha=1;});
 art.mid=mkC(16,16,function(g){g.fillStyle=th.gIn;g.fillRect(0,0,16,16);g.fillStyle=th.gLine;g.fillRect(2,5,1,6);g.fillRect(2,10,7,1);g.fillRect(12,2,1,5);g.fillRect(8,13,6,1);});
 art.plat=mkC(16,16,function(g){g.fillStyle=th.plat;g.fillRect(0,0,16,6);g.fillStyle=th.gTop;g.fillRect(0,0,16,1);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,5,16,1);g.fillRect(3,1,1,4);g.fillRect(12,1,1,4);});
 return art;}

/* ---------- levels ---------- */
var CFG=[
 {name:'NEON YARD',len:150,seed:1337,soldier:0.55,drone:0.18,turret:0,gapMax:3,theme:0,boss:false},
 {name:'IRON WORKS',len:180,seed:4242,soldier:0.6,drone:0.3,turret:0.3,gapMax:3,theme:1,boss:false},
 {name:'STORM CORE',len:150,seed:9001,soldier:0.6,drone:0.35,turret:0.35,gapMax:3,theme:2,boss:true}
];
var SCORE={soldier:100,drone:150,turret:200};
function genLevel(idx){var cfg=CFG[idx],rng=rng32(cfg.seed),CAP=cfg.len+80+ARENA,tiles=[],r,c,k;
 for(r=0;r<ROWS;r++){var row=[];for(c=0;c<CAP;c++)row.push(0);tiles.push(row);}
 var L={idx:idx,cfg:cfg,W:0,tiles:tiles,spawns:[],pickups:[],cps:[],exit:null,arena:null,theme:THEMES[cfg.theme],lastCp:null};
 function col(x,h){for(var rr=h;rr<ROWS;rr++)tiles[rr][x]=1;}
 var h=13,x=0,third=Math.floor(cfg.len/3),nextCp=third;
 for(;x<14;x++)col(x,h);
 while(x<cfg.len){
  var seg=6+Math.floor(rng()*8);if(x+seg>cfg.len)seg=cfg.len-x;
  var s0=x;for(var i=0;i<seg;i++,x++)col(x,h);
  if(s0>=nextCp&&seg>=3){L.cps.push({x:(s0+1)*TS,h:h,on:false,arena:false});nextCp+=third;}
  if(s0>=18){
   if(seg>=6&&rng()<cfg.soldier)L.spawns.push({t:'soldier',x:(s0+seg-2)*TS,y:h*TS-14,minX:s0*TS,maxX:(s0+seg)*TS-10});
   if(seg>=5&&rng()<cfg.turret)L.spawns.push({t:'turret',x:(s0+2)*TS+1,y:h*TS-10});
   if(rng()<cfg.drone)L.spawns.push({t:'drone',x:(s0+Math.floor(seg/2))*TS,y:Math.max(3,h-6)*TS});
  }
  if(rng()<0.6){var gn=2+Math.floor(rng()*3);for(k=0;k<gn&&k<seg-1;k++)L.pickups.push({k:'gem',x:(s0+1+k)*TS+4,y:(h-2)*TS+4});}
  if(seg>=7&&rng()<0.55){var pl=3+Math.floor(rng()*3),py=h-3,px=s0+1+Math.floor(rng()*Math.max(1,seg-pl-1));
   for(k=0;k<pl;k++)tiles[py][px+k]=2;
   var rr2=rng();
   if(rr2<0.2)L.pickups.push({k:rng()<0.5?'rapid':'spread',x:(px+1)*TS+4,y:(py-1)*TS+4});
   else if(rr2<0.32)L.pickups.push({k:'heart',x:(px+1)*TS+4,y:(py-1)*TS+4});
   else for(k=0;k<pl;k++)L.pickups.push({k:'gem',x:(px+k)*TS+4,y:(py-1)*TS+4});}
  if(x>=cfg.len)break;
  var t=rng();
  if(t<0.33&&x>16){x+=2+Math.floor(rng()*(cfg.gapMax-1));}
  else if(t<0.7){var dh=(rng()<0.5?-1:1)*(1+Math.floor(rng()*2));h=clamp(h+dh,9,14);}
 }
 while(h!==13){h+=h<13?1:-1;for(k=0;k<3;k++,x++)col(x,h);}
 if(!cfg.boss){
  for(k=0;k<12;k++,x++)col(x,13);
  L.exit={x:(x-5)*TS,y:13*TS-32,w:16,h:32};
  for(r=0;r<ROWS;r++)tiles[r][x]=1;x++;
 }else{
  for(k=0;k<4;k++,x++)col(x,13);
  var a0=x;L.arena={c0:a0,x0:a0*TS,started:false};
  for(k=0;k<ARENA;k++,x++)col(x,13);
  for(r=0;r<ROWS;r++)tiles[r][x-1]=1;
  for(k=0;k<4;k++){tiles[10][a0+5+k]=2;tiles[10][a0+ARENA-9+k]=2;}
  L.cps.push({x:(a0+1)*TS,h:13,on:false,arena:true});
 }
 L.W=x;for(r=0;r<ROWS;r++)tiles[r].length=x;
 return L;}

/* ---------- state ---------- */
var mode='title',timer=0,frame=0,level=0,score=0,lives=3,best=parseInt(store.get('avb_best')||'0',10)||0;
var levelTime=0,totalTime=0,levelStartScore=0,bonus=0,bonusLeft=0,newBest=false,winDelay=0,cheat=false;
var L=null,ART=null,P=null,ents=[],bullets=[],parts=[],picks=[],texts=[],boss=null;
var cam={x:0,shake:0};
var titleArt=buildArt(THEMES[0],77);

function tileAt(c,r){if(c<0||c>=L.W)return 1;if(r<0||r>=ROWS)return 0;return L.tiles[r][c];}
function moveX(e){e.hitWall=false;if(!e.vx)return;e.x+=e.vx;var r0=Math.floor(e.y/TS),r1=Math.floor((e.y+e.h-0.01)/TS),c,r;
 if(e.vx>0){c=Math.floor((e.x+e.w-0.01)/TS);for(r=r0;r<=r1;r++)if(tileAt(c,r)===1){e.x=c*TS-e.w;e.vx=0;e.hitWall=true;return;}}
 else{c=Math.floor(e.x/TS);for(r=r0;r<=r1;r++)if(tileAt(c,r)===1){e.x=(c+1)*TS;e.vx=0;e.hitWall=true;return;}}}
function moveY(e,drop){var pb=e.y+e.h;e.y+=e.vy;e.onGround=false;var c0=Math.floor(e.x/TS),c1=Math.floor((e.x+e.w-0.01)/TS),c,r,t;
 if(e.vy>=0){r=Math.floor((e.y+e.h)/TS);for(c=c0;c<=c1;c++){t=tileAt(c,r);if(t===1||(t===2&&!drop&&pb<=r*TS+0.5)){e.y=r*TS-e.h;e.vy=0;e.onGround=true;return;}}}
 else{r=Math.floor(e.y/TS);for(c=c0;c<=c1;c++)if(tileAt(c,r)===1){e.y=(r+1)*TS;e.vy=0;return;}}}

function newPlayer(x,y){return{x:x,y:y,w:10,h:14,vx:0,vy:0,onGround:false,face:1,cd:0,coyote:0,jb:0,inv:0,hp:5,maxhp:5,rapid:0,spread:0,anim:0,aimUp:false,drop:0,dead:false};}
function makeEnemy(d){var e={t:d.t,x:d.x,y:d.y,vx:0,vy:0,w:10,h:14,hp:3,flash:0,cd:60+(R()*60|0),face:-1,minX:d.minX,maxX:d.maxX,baseY:d.y,ph:R()*6.28,active:false,onGround:false,anim:0,ang:Math.PI,recoil:0};
 if(d.t==='drone'){e.w=14;e.h=8;e.hp=2;}if(d.t==='turret'){e.w=14;e.h=10;e.hp=5;}return e;}

function startLevel(i){level=i;L=genLevel(i);ART=buildArt(L.theme,L.cfg.seed+7);ents=[];bullets=[];parts=[];texts=[];picks=[];boss=null;winDelay=0;
 for(var k=0;k<L.spawns.length;k++)ents.push(makeEnemy(L.spawns[k]));
 for(k=0;k<L.pickups.length;k++){var q=L.pickups[k];picks.push({k:q.k,x:q.x,y:q.y,w:8,h:8,ph:k*0.7,fall:false,vy:0});}
 P=newPlayer(3*TS,13*TS-14);cam.x=0;cam.shake=0;levelTime=0;levelStartScore=score;mode='intro';timer=0;setMusic(i);}
function newGame(){score=0;lives=3;totalTime=0;newBest=false;startLevel(0);}
function retry(){lives=3;score=levelStartScore;startLevel(level);}
function saveBest(){if(score>best){best=score;newBest=true;store.set('avb_best',String(best));}}

/* ---------- fx ---------- */
function part(x,y,vx,vy,life,col,sz,gr){if(parts.length>350)return;parts.push({x:x,y:y,vx:vx,vy:vy,life:life,col:col,sz:sz||2,gr:gr||0});}
function burst(x,y,n,col,spd,life){for(var i=0;i<n;i++){var a=R()*6.283,s=R()*spd;part(x,y,Math.cos(a)*s,Math.sin(a)*s-0.5,(life*(0.5+R()*0.5))|0,col,R()<0.3?3:2,0.08);}}
function explode(x,y,big){burst(x,y,big?40:16,'#ffd23d',big?3.5:2.2,big?50:30);burst(x,y,big?24:10,'#ff5a3d',big?2.5:1.6,big?40:24);burst(x,y,big?14:6,'#ffffff',1.2,18);cam.shake=Math.max(cam.shake,big?8:3);}
function updParts(){var n=[];for(var i=0;i<parts.length;i++){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.gr;p.vx*=0.98;if(--p.life>0)n.push(p);}parts=n;}
function ftext(x,y,s,col){texts.push({x:x,y:y,s:s,col:col||'#fff',life:60});}
function updTexts(){var n=[];for(var i=0;i<texts.length;i++){var t=texts[i];t.y-=0.5;if(--t.life>0)n.push(t);}texts=n;}

/* ---------- player ---------- */
function onOneWay(p){var r=Math.floor((p.y+p.h+1)/TS),c0=Math.floor(p.x/TS),c1=Math.floor((p.x+p.w-0.01)/TS);for(var c=c0;c<=c1;c++){if(tileAt(c,r)===1)return false;}for(c=c0;c<=c1;c++){if(tileAt(c,r)===2)return true;}return false;}
function updatePlayer(){var p=P,i=inp;var dir=(i.right?1:0)-(i.left?1:0);if(dir)p.face=dir;p.aimUp=!!i.up;
 var target=dir*1.9,acc=p.onGround?0.4:0.25,d=target-p.vx;p.vx+=d>acc?acc:(d<-acc?-acc:d);
 if(p.inv>60&&p.knock){p.vx=p.knock;}else p.knock=0;
 if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;
 if(pr.jump)p.jb=7;else if(p.jb>0)p.jb--;
 if(p.jb>0&&i.down&&p.onGround&&onOneWay(p)){p.drop=12;p.jb=0;p.onGround=false;}
 else if(p.jb>0&&p.coyote>0){p.vy=-6.3;p.coyote=0;p.jb=0;p.onGround=false;sfx('jump');for(var k=0;k<5;k++)part(p.x+5,p.y+p.h,(R()-0.5)*1.5,-R(),14,'#8fa',2,0.02);}
 if(!i.jump&&p.vy<-2.6)p.vy=-2.6;
 p.vy=Math.min(p.vy+0.34,7);if(p.drop>0)p.drop--;
 moveX(p);moveY(p,p.drop>0);
 if(p.onGround&&Math.abs(p.vx)>0.3)p.anim+=Math.abs(p.vx)*0.14;else p.anim=0;
 if(p.cd>0)p.cd--;
 if(i.fire&&p.cd<=0){firePlayer();p.cd=p.rapid>0?6:12;}
 if(p.rapid>0)p.rapid--;if(p.spread>0)p.spread--;if(p.inv>0)p.inv--;
 if(cheat){p.hp=p.maxhp;p.inv=Math.max(p.inv,2);}
 if(p.y>ROWS*TS+30)loseLife();}
function firePlayer(){var p=P,bx,by,angs=p.spread>0?[-0.2,0,0.2]:[0];
 if(p.aimUp){bx=p.x+p.w/2-1;by=p.y-6;}else{bx=p.face>0?p.x+p.w+2:p.x-8;by=p.y+6;}
 for(var k=0;k<angs.length;k++){var a=angs[k],vx,vy;if(p.aimUp){vx=Math.sin(a)*5;vy=-Math.cos(a)*5;}else{vx=Math.cos(a)*5*p.face;vy=Math.sin(a)*5;}
  bullets.push({x:bx,y:by,vx:vx,vy:vy,w:p.aimUp?2:6,h:p.aimUp?6:2,from:'p',life:70,dmg:1});}
 sfx('shoot');}
function hurtPlayer(srcX){if(P.inv>0||P.dead||mode!=='play')return;P.hp--;P.inv=80;P.knock=P.x+5<srcX?-2.2:2.2;P.vy=-3.2;cam.shake=Math.max(cam.shake,5);sfx('hurt');burst(P.x+5,P.y+7,8,'#ff5a6a',1.8,20);if(P.hp<=0)loseLife();}
function loseLife(){if(mode!=='play')return;mode='dead';timer=0;lives--;P.dead=true;explode(P.x+5,Math.min(P.y+7,VH-4),true);sfx('die');}
function respawn(){var cp=L.lastCp,x=cp?cp.x:3*TS,y=cp?cp.h*TS-14:13*TS-14;P=newPlayer(x,y);P.inv=100;bullets=[];
 var e2=[];for(var i=0;i<ents.length;i++)if(ents[i].t!=='wave')e2.push(ents[i]);ents=e2;mode='play';
 if(!(L.arena&&L.arena.started))cam.x=clamp(x-VW*0.4,0,L.W*TS-VW);}
function gameOver(){mode='over';timer=0;saveBest();mus.pat=null;}
function levelClear(){mode='clear';timer=0;bonus=Math.max(500,6000-Math.floor(levelTime/60)*40);bonusLeft=bonus;sfx('clear');mus.pat=null;}
function gameWin(){mode='win';timer=0;bonus=lives*1000;score+=bonus;saveBest();sfx('clear');mus.pat=null;}

/* ---------- enemies ---------- */
function rate(b){return Math.max(40,b-level*14);}
function eShoot(x,y,vx,vy){bullets.push({x:x-2,y:y-2,w:4,h:4,vx:vx,vy:vy,from:'e',life:220});sfx('eshoot');}
function aimShoot(e,spd){var cx=e.x+e.w/2,cy=e.y+e.h/2,a=Math.atan2(P.y+7-cy,P.x+5-cx);eShoot(cx,cy,Math.cos(a)*spd,Math.sin(a)*spd);}
function updSoldier(e){e.vy=Math.min(e.vy+0.34,7);var dx=(P.x+5)-(e.x+5),dy=P.y-e.y;
 if(Math.abs(dx)<175&&Math.abs(dy)<44&&!P.dead){e.face=dx>0?1:-1;e.vx=0;e.cd--;if(e.cd<=0){eShoot(e.x+(e.face>0?e.w+3:-3),e.y+7,e.face*2.3,0);e.cd=rate(100);e.recoil=6;}}
 else{if(e.onGround){var fx=e.face>0?e.x+e.w+1:e.x-1;if(tileAt(Math.floor(fx/TS),Math.floor((e.y+e.h+2)/TS))===0)e.face*=-1;}
  if(e.x<e.minX)e.face=1;if(e.x>e.maxX)e.face=-1;e.vx=0.55*e.face;e.anim+=0.15;}
 moveX(e);if(e.hitWall)e.face*=-1;moveY(e,false);if(e.recoil>0)e.recoil--;if(e.y>ROWS*TS+20)e.dead=true;}
function updDrone(e){e.ph+=0.05;var cx=e.x+7,tx=P.x+5,dx=tx-cx,want=tx+(dx>0?-70:70);if(Math.abs(dx)<320)e.x+=clamp((want-cx)*0.02,-0.9,0.9);
 e.y=e.baseY+Math.sin(e.ph)*12;e.face=dx>0?1:-1;e.cd--;if(e.cd<=0&&Math.abs(dx)<230&&!P.dead){aimShoot(e,2.0);e.cd=rate(130);}}
function updTurret(e){var cx=e.x+7,cy=e.y+3,dx=P.x+5-cx,dy=P.y+7-cy;e.ang=Math.atan2(dy,dx);if(dy>10)e.ang=dx>0?0.2:Math.PI-0.2;
 e.cd--;if(e.cd<=0&&Math.abs(dx)<240&&!P.dead){var s=2.1;eShoot(cx+Math.cos(e.ang)*9,cy+Math.sin(e.ang)*9,Math.cos(e.ang)*s,Math.sin(e.ang)*s);e.cd=rate(110);}}
function updWave(e){e.x+=e.vx;e.life--;var fc=Math.floor((e.vx>0?e.x+e.w:e.x)/TS);if(tileAt(fc,Math.floor((e.y+5)/TS))===1||e.life<=0)e.dead=true;
 if(R()<0.5)part(e.x+5,e.y+8,(R()-0.5),-R()*1.5,20,L.theme.acc,2,0.05);if(!e.dead&&overlap(P,e))hurtPlayer(e.x+5);}
function startBoss(){var A=L.arena;A.started=true;for(var r=0;r<13;r++)L.tiles[r][A.c0]=1;cam.shake=6;sfx('boom');
 boss={t:'boss',x:(A.c0+15)*TS,y:-60,vx:0,vy:0,w:40,h:44,hp:90,maxhp:90,flash:0,state:'intro',timer:0,face:-1,phase:1,active:true,landed:false,last:'',shots:0,cface:-1,onGround:false};
 ents.push(boss);setMusic(3);for(var k=0;k<L.cps.length;k++)if(L.cps[k].arena){L.cps[k].on=true;L.lastCp=L.cps[k];}
 ftext(A.x0+VW/2,80,'WARNING','#ff3d5a');}
function nextB(e,s){e.state=s;e.timer=0;e.shots=0;}
function fan(e,n,spd){var cx=e.x+e.w/2,cy=e.y+16,a0=Math.atan2(P.y+7-cy,P.x+5-cx);for(var i=0;i<n;i++){var a=a0+(i-(n-1)/2)*0.22;eShoot(cx,cy,Math.cos(a)*spd,Math.sin(a)*spd);}}
function updateBoss(e){e.timer++;var dx=(P.x+5)-(e.x+e.w/2);
 if(e.state!=='charge'&&e.state!=='slam'&&e.state!=='dying')e.face=dx>0?1:-1;
 e.vy=Math.min(e.vy+0.34,8);
 switch(e.state){
  case 'intro':if(e.onGround&&!e.landed){e.landed=true;cam.shake=10;sfx('boom');burst(e.x+20,e.y+44,24,'#bbb',2.5,30);ftext(e.x+20,e.y-12,'WARDEN MK-IV','#ff3d5a');}
   if(e.landed&&e.timer>110)nextB(e,'idle');break;
  case 'idle':e.vx*=0.8;if(Math.abs(e.vx)<0.05)e.vx=0;if(e.timer>(e.phase===2?28:48)){var opts=['spread','slam','summon'];if(e.phase===2){opts.push('charge');opts.push('charge');}
   var pick=e.last;while(pick===e.last)pick=opts[Math.floor(R()*opts.length)];e.last=pick;nextB(e,pick);}break;
  case 'spread':e.vx=0;if(e.timer%24===12){fan(e,e.phase===2?7:5,2.3);e.shots++;}if(e.shots>=3&&e.timer%24===20)nextB(e,'idle');break;
  case 'slam':if(e.timer===1){e.vy=-7.5;e.vx=clamp(dx/48,-3.2,3.2);e.onGround=false;}
   else if(e.onGround&&e.timer>5){cam.shake=9;sfx('boom');burst(e.x+20,e.y+44,16,'#bbb',2,24);
    ents.push({t:'wave',x:e.x-4,y:e.y+e.h-10,w:10,h:10,vx:-2.8,life:200,active:true,flash:0});
    ents.push({t:'wave',x:e.x+e.w-6,y:e.y+e.h-10,w:10,h:10,vx:2.8,life:200,active:true,flash:0});
    nextB(e,'idle');}break;
  case 'summon':e.vx=0;if(e.timer===20){var alive=0;for(var i=0;i<ents.length;i++)if(ents[i].t==='drone'&&!ents[i].dead)alive++;

<script id="av-shell-20261124">/* AVIDAA shell: shared header (or floating pill) + footer with the "Last updated" stamp. No outside calls, no tracking.
   Template tokens are replaced when a page is built: Breach --av-games Games 2026-11-25 02:07 */
(function(){
  var NAME='Breach',SECTOR='--av-games',STAMP='2026-11-25 02:07',HOME='https://avidaa1.github.io/';
  var ARROW='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function build(){
    if(!document.body||document.querySelector('.av-footer'))return;
    var root=document.documentElement,body=document.body;
    root.style.setProperty('--av-accent','var('+SECTOR+')');
    var appLike=getComputedStyle(body).overflowY==='hidden'||getComputedStyle(root).overflowY==='hidden'||root.scrollHeight<=innerHeight*1.02;
    var hasHome=[].some.call(document.querySelectorAll('a[href]'),function(a){var h=(a.getAttribute('href')||'').replace(/#.*$/,'');return /^https:\/\/avidaa1\.github\.io\/?$/.test(h)&&a.offsetParent!==null;});
    var footer=document.createElement('footer');
    footer.className='av-footer'+(appLike?' av-footer--bar':'');
    footer.innerHTML=(appLike?'':'<a href="'+HOME+'">AVIDAA home</a>')+'<span class="av-stamp">Last updated '+STAMP+' UTC</span>';
    root.appendChild(footer);
    var fixedTop=[],fixedBottom=[];
    function collect(){
      var all=body.querySelectorAll('*');
      for(var i=0;i<all.length&&i<2500;i++){
        var e=all[i];if(e.closest('.av-header,.av-footer,.av-pill'))continue;var cs=getComputedStyle(e);
        if(cs.position!=='fixed'||e.getBoundingClientRect().width<innerWidth*0.4)continue;
        if(cs.top!=='auto'&&parseFloat(cs.top)<=8)fixedTop.push([e,parseFloat(cs.top)]);
        else if(cs.bottom!=='auto'&&parseFloat(cs.bottom)<=8)fixedBottom.push([e,parseFloat(cs.bottom)]);
      }
    }
    var HH=0,FB=appLike?28:0;
    if(!appLike){
      var h=document.createElement('header');h.className='av-header';
      h.innerHTML='<a class="av-back" href="'+HOME+'" aria-label="Back to AVIDAA home">'+ARROW+'AVIDAA</a><span class="av-title"></span>';
      h.querySelector('.av-title').textContent=NAME;
      root.insertBefore(h,body);HH=h.offsetHeight||48;
    }
    collect();
    function place(){
      var off=Math.max(0,HH-(window.scrollY||0));
      fixedTop.forEach(function(x){x[0].style.top=(x[1]+off)+'px';});
      fixedBottom.forEach(function(x){x[0].style.bottom=(x[1]+FB)+'px';});
    }
    place();addEventListener('scroll',place,{passive:true});addEventListener('resize',place);
    if(appLike&&!hasHome){
      var p=document.createElement('a');p.className='av-pill';p.href=HOME;p.setAttribute('aria-label','Back to AVIDAA home');

      var UI='a,button,input,select,textarea,[onclick],[role=button]';
      function busy(l,t,w,hh){
        for(var yy=0;yy<3;yy++)for(var xx=0;xx<3;xx++){
          var els=document.elementsFromPoint(l+w*(xx+.5)/3,t+hh*(yy+.5)/3);
          for(var q=0;q<els.length;q++){if(els[q]===p||p.contains(els[q]))continue;if(els[q].matches&&els[q].matches(UI))return true;}
        }return false;
      }
      var r=p.getBoundingClientRect(),w=r.width,hh=r.height,vw=innerWidth,vh=innerHeight;
      var spots=[['top:8px;right:8px',vw-w-8,8],['top:8px;left:8px',8,8],['bottom:'+(FB+8)+'px;right:8px',vw-w-8,vh-hh-FB-8],['bottom:'+(FB+8)+'px;left:8px',8,vh-hh-FB-8]];
      for(var si=0;si<spots.length;si++){p.style.cssText='top:auto;right:auto;bottom:auto;left:auto;'+spots[si][0];if(!busy(spots[si][1],spots[si][2],w,hh))break;}
    }
  }
  if(document.readyState==='complete'||document.readyState==='interactive')setTimeout(build,0);else addEventListener('DOMContentLoaded',function(){setTimeout(build,0);});
})();
